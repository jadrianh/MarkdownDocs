<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Markdown Docs - Minimalist Editor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Icons for technical styling -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,0,0" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', '"Liberation Mono"', '"Courier New"', 'monospace'],
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans"', 'sans-serif', '"Apple Color Emoji"', '"Segoe UI Emoji"', '"Segoe UI Symbol"', '"Noto Color Emoji"'],
          },
          colors: {
            brand: {
              DEFAULT: '#4f46e5', // indigo-600
              hover: '#4338ca', // indigo-700
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
    }
    
    /* Custom scrollbar for editor */
    textarea::-webkit-scrollbar {
      width: 8px;
    }
    textarea::-webkit-scrollbar-track {
      background: transparent;
    }
    textarea::-webkit-scrollbar-thumb {
      background-color: #d4d4d8; /* zinc-300 */
      border-radius: 4px;
    }
    
    /* Ensure full height for h-screen layout */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans flex flex-col h-screen antialiased selection:bg-brand selection:text-white">
<!-- BEGIN: Top Navigation Bar -->
<header class="flex items-center justify-between px-4 py-2 border-b border-zinc-200/60 bg-white shadow-sm shrink-0 h-14" data-purpose="main-header">
<!-- Branding -->
<div class="flex items-center gap-3">
<div class="w-8 h-8 bg-zinc-800 rounded-sm flex items-center justify-center text-white font-bold text-sm">
        Md
      </div>
<div>
<h1 class="text-sm font-semibold leading-tight text-zinc-900">Markdown Docs</h1>
<p class="text-xs text-zinc-500 font-mono">Editor Inteligente</p>
</div>
</div>
<!-- Actions -->
<div class="flex items-center gap-2 text-sm font-medium">
<button class="flex items-center gap-1.5 px-3 py-1.5 text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 rounded-sm transition-colors">
<span class="material-symbols-outlined text-[18px]">visibility</span>
        VISTA PREVIA
      </button>
<div class="w-px h-4 bg-zinc-200 mx-1"></div>
<button aria-label="Configuración" class="p-1.5 text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 rounded-sm transition-colors mr-1">
<span class="material-symbols-outlined text-[18px]">settings</span>
</button>
<button class="flex items-center gap-1.5 px-4 py-1.5 bg-brand hover:bg-brand-hover text-white rounded-sm transition-colors shadow-sm">
<span class="material-symbols-outlined text-[18px]">magic_button</span>
        ANALIZAR
      </button>
</div>
</header>
<!-- END: Top Navigation Bar -->
<!-- BEGIN: Main Workspace -->
<main class="flex-1 flex overflow-hidden" data-purpose="main-workspace">
<!-- BEGIN: Editor Column -->
<section class="flex-1 flex flex-col min-w-0 border-r border-zinc-200/60 bg-white" data-purpose="editor-section">
<!-- Toolbar -->
<div class="flex items-center justify-between px-3 py-2 border-b border-zinc-200/60 text-zinc-600 bg-zinc-50/50 shrink-0 h-10">
<!-- Formatting Tools -->
<div class="flex items-center gap-1">
<button class="p-1 hover:bg-zinc-200/60 rounded-sm transition-colors text-zinc-700" title="Negrita">
<span class="material-symbols-outlined text-[18px] font-bold">format_bold</span>
</button>
<button class="p-1 hover:bg-zinc-200/60 rounded-sm transition-colors text-zinc-700" title="Cursiva">
<span class="material-symbols-outlined text-[18px] italic">format_italic</span>
</button>
<div class="w-px h-4 bg-zinc-200 mx-1"></div>
<button class="p-1 hover:bg-zinc-200/60 rounded-sm transition-colors text-zinc-700" title="Título">
<span class="material-symbols-outlined text-[18px]">title</span>
</button>
<button class="p-1 hover:bg-zinc-200/60 rounded-sm transition-colors text-zinc-700" title="Lista numerada">
<span class="material-symbols-outlined text-[18px]">format_list_numbered</span>
</button>
<button class="p-1 hover:bg-zinc-200/60 rounded-sm transition-colors text-zinc-700" title="Lista con viñetas">
<span class="material-symbols-outlined text-[18px]">format_list_bulleted</span>
</button>
</div>
<!-- Utility Tools -->
<div class="flex items-center gap-2 text-xs font-mono">
<!-- Language Selector -->
<div class="flex items-center gap-1 cursor-pointer hover:text-zinc-900 pr-2 border-r border-zinc-200">
            ESPAÑOL
            <span class="material-symbols-outlined text-[16px]">expand_more</span>
</div>
<!-- History & Clipboard -->
<div class="flex items-center gap-1 pl-1">
<button class="p-1 hover:bg-zinc-200/60 rounded-sm transition-colors" title="Deshacer">
<span class="material-symbols-outlined text-[18px]">undo</span>
</button>
<button class="p-1 hover:bg-zinc-200/60 rounded-sm transition-colors" title="Rehacer">
<span class="material-symbols-outlined text-[18px]">redo</span>
</button>
<button class="p-1 hover:bg-zinc-200/60 rounded-sm transition-colors" title="Copiar">
<span class="material-symbols-outlined text-[18px]">content_copy</span>
</button>
<button class="p-1 hover:bg-zinc-200/60 rounded-sm transition-colors text-red-500/70 hover:text-red-600" title="Eliminar">
<span class="material-symbols-outlined text-[18px]">delete</span>
</button>
</div>
</div>
</div>
<!-- Editor Textarea -->
<div class="flex-1 relative">
<textarea class="w-full h-full p-6 resize-none outline-none border-none focus:ring-0 text-base font-mono leading-relaxed text-zinc-800 placeholder-zinc-400 bg-transparent" placeholder="Comienza a escribir..." spellcheck="false"></textarea>
</div>
<!-- Footer Bar -->
<div class="flex items-center justify-between px-4 py-2 border-t border-zinc-200/60 bg-zinc-50/50 shrink-0 text-xs font-mono text-zinc-500">
<button class="flex items-center gap-1.5 text-brand hover:text-brand-hover transition-colors font-sans font-medium px-2 py-1 rounded-sm hover:bg-indigo-50">
<span class="material-symbols-outlined text-[16px]">format_quote</span>
          Ejemplo de texto
        </button>
<div class="flex gap-4">
<span>0 PALABRAS</span>
<span>0 CARACTERES</span>
</div>
</div>
</section>
<!-- END: Editor Column -->
<!-- BEGIN: Suggestions Sidebar -->
<aside class="w-80 flex flex-col bg-zinc-50 shrink-0" data-purpose="suggestions-sidebar">
<!-- Sidebar Header -->
<div class="flex items-center gap-2 px-4 py-3 border-b border-zinc-200/60 h-10 shrink-0 bg-white">
<span class="material-symbols-outlined text-brand text-[18px]">auto_awesome</span>
<h2 class="text-xs font-bold tracking-wider text-zinc-700">SUGERENCIAS</h2>
</div>
<!-- Sidebar Content (Empty State) -->
<div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
<div class="w-12 h-12 bg-zinc-100 rounded-full flex items-center justify-center mb-4 border border-zinc-200/60">
<span class="material-symbols-outlined text-zinc-400">auto_awesome</span>
</div>
<p class="text-xs font-mono text-zinc-400 tracking-wide uppercase">Esperando texto...</p>
</div>
</aside>
<!-- END: Suggestions Sidebar -->
</main>
<!-- END: Main Workspace -->
<!-- Attribution Footer -->
<div class="fixed bottom-2 left-2 text-[10px] font-mono text-zinc-400 pointer-events-none">
    Made By: Adrian H.
  </div>
</body></html>
