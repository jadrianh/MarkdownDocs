    }
    .brand-text {
      fill: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hanken Grotesk", sans-serif;
      font-weight: 700;
      font-size: 14px;
    }
    @media (prefers-color-scheme: dark) {
